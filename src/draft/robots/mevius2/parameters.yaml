# MEVIUS2 expressed in Draft's native parametric format.
# Joint locations/ranges and foot radius: urdf/mevius2/mevius2.urdf.
# Cylinders/loft replace CAD shells; masses and inertia follow Draft's trends.
# L/M/S are ordinary actuator classes; roles below choose a class per joint.
L_motor: RS03
L_motor_effort: 60.0
L_motor_velocity: 18.85       # URDF joint cap (catalogue no-load speed: 195 rpm)
L_motor_gear: 9.0
L_motor_friction: 0.0
L_motor_damping: 0.0

M_motor: RS01
M_motor_effort: 17.0
M_motor_velocity: 28.7979326579
M_motor_gear: 7.75
M_motor_friction: 0.0
M_motor_damping: 0.0

S_motor: AK10-9 V2
S_motor_effort: 48.0
S_motor_velocity: 31.1017672705
S_motor_gear: 9.0
S_motor_friction: 0.0
S_motor_damping: 0.0

hip_roll_mot: L
hip_pitch_mot: L
knee_mot: L
hip_roll_range: [-0.7854, 0.7854]
hip_pitch_range: [-1.0472, 2.6180]
knee_range: [-2.8508, -0.7812]

# Source main collision box; the small front electronics enclosure is omitted.
torso_lx: 0.400
torso_ly: 0.211
torso_lz: 0.190
torso_center_height: 0.065
torso_chamfer: 0.01
shoulder_width: 0.160
hip_mount_x_offset: 0.003
hip_mount_height: 0.062
hip_abduction_link_length: 0.0625
hip_lateral_offset: 0.016
hip_roll_link_length: 0.077
upper_leg_link_length: 0.300
lower_leg_link_length: 0.285
foot_x_offset: 0.00263       # URDF foot-site X; stock sphere is on the shank axis
foot_sphere_r: 0.030
foot_mass_kg: 0.120

mass_composition_reference: quadruped
size_metric_expr: ${upper_leg_link_length + lower_leg_link_length}
torso_rho: 150.0             # replaced by the common quadruped density trend
thigh_rho: 370.7
shank_rho: 637.1
motor_rho: 2700.0
link_render_radius_scale: 0.70
upper_leg_link_render_r: ${min(knee_motor_r, knee_motor_L / 2) * link_render_radius_scale}
lower_leg_render_scale: 0.8
lower_leg_link_render_r: ${upper_leg_link_render_r * lower_leg_render_scale}
knee_pivot_scale: 0.65
link_motor_penetration: 0.005

# Hip-roll housings are mounted inside the source torso. Abduction members
# meet their mounting face; other actuator/structure overlaps still fail.
structure_overlap_allowed:
  - hip_roll
  - fl_roll_link_link
  - fr_roll_link_link
  - rl_roll_link_link
  - rr_roll_link_link
# Belt-driven knee: the proximal motor is charged once; distal pulley is visual.
packing_exempt_geoms:
  - fl_upper_leg_link_motor
  - fr_upper_leg_link_motor
  - rl_upper_leg_link_motor
  - rr_upper_leg_link_motor

link_color: 0.72 0.74 0.77 1.0
motor_color: 0.28 0.30 0.33 1.0
mot_detail_color: 0.12 0.14 0.17 1.0
torso_color: 0.72 0.74 0.77 1.0
foot_color: 0.14 0.16 0.19 1.0

# Existing for_each syntax; no robot-specific Python or editor backend.
legs:
  - {name: fl, front: 1, side: 1, fore_axis: x, side_axis: y}
  - {name: fr, front: 1, side: -1, fore_axis: x, side_axis: -y}
  - {name: rl, front: -1, side: 1, fore_axis: -x, side_axis: y}
  - {name: rr, front: -1, side: -1, fore_axis: -x, side_axis: -y}
