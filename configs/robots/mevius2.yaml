name: mevius2
label: MEVIUS2
urdf: urdf/mevius2/mevius2.urdf
motor: configs/motors/robstride03.yaml
base_link: base_link
# Explicit maps avoid guessing the meaning of BR/BL or a vendor's "hip".
legs:
  fl:
    joints: {hip_roll: FL_collar_joint, hip_pitch: FL_hip_joint, knee: FL_knee_joint}
    foot: FL_foot_link
  fr:
    joints: {hip_roll: FR_collar_joint, hip_pitch: FR_hip_joint, knee: FR_knee_joint}
    foot: FR_foot_link
  rl:
    joints: {hip_roll: BL_collar_joint, hip_pitch: BL_hip_joint, knee: BL_knee_joint}
    foot: BL_foot_link
  rr:
    joints: {hip_roll: BR_collar_joint, hip_pitch: BR_hip_joint, knee: BR_knee_joint}
    foot: BR_foot_link
parameters:
  kp: 100.0                     # CPU standing preset; vendor controller uses 50 / 2
  kd: 5.0
  effort_limit_nm: 60.0
  joint_speed_limit_rad_s: 18.85 # source URDF; braking remains available above it
  armature_kgm2: 0.02           # inherited from vendor MJCF, not a measurement here
  joint_damping: 0.0
  joint_frictionloss: 0.0
  stance_hip_roll: 0.0
  stance_hip_pitch: 0.7         # source DEFAULT_ANGLE
  stance_knee: -1.2
  payload_mass_kg: 0.0
  payload_x: 0.0
  payload_y: 0.0
  payload_z: 0.23
  payload_size_x: 0.30
  payload_size_y: 0.20
  payload_size_z: 0.10
  ground_friction: 0.8
  full_body_collisions: true
  timestep: 0.002
  thermal_enabled: false
  initial_temperature_c: 25.0
  ambient_temperature_c: 25.0
